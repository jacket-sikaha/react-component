<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="keywords" content="天地图" />
    <title>天地图－地图API－范例－根据关键字本地搜索</title>
    <style type="text/css">
      .search {
        font-size: 13px;
        border: 1px solid #999999;
      }

      .ls {
        line-height: 27px;
        padding-left: 7px;
      }

      .prompt {
        display: none;
        font-size: 13px;
        border: 1px solid #999999;
      }

      .statistics {
        display: none;
        font-size: 13px;
        border: 1px solid #999999;
        overflow-y: scroll;
        height: 150px;
      }

      .suggests {
        display: none;
        font-size: 13px;
        border: 1px solid #999999;
      }

      .lineData {
        display: none;
        font-size: 13px;
        border: 1px solid #999999;
      }

      .result {
        display: none;
        font-size: 12px;
        border: 1px solid #999999;
        line-height: 27px;
        padding-left: 7px;
      }
    </style>
    <script
      type="text/javascript"
      src="http://api.tianditu.gov.cn/api?v=4.0&tk=3208b0182526637fb68e26ee8e2e69ba"
    ></script>
    <style type="text/css">
      body,
      html {
        width: 100%;
        height: 100%;
        margin: 0;
        font-family: "Microsoft YaHei";
      }
      #mapDiv {
        width: 100%;
        height: 400px;
      }
      input,
      b,
      p {
        margin-left: 5px;
        font-size: 14px;
      }
    </style>
    <script>
      var map;
      var zoom = 12;
      var localsearch;
      function onLoad() {
        //初始化地图对象
        map = new T.Map("mapDiv");
        //设置显示地图的中心点和级别
        map.centerAndZoom(new T.LngLat(116.40969, 39.89945), zoom);

        var config = {
          pageCapacity: 10, //每页显示的数量
          onSearchComplete: localSearchResult, //接收数据的回调函数
        };
        //创建搜索对象
        localsearch = new T.LocalSearch(map, config);

        const lo = new T.Geolocation();
        const fn = function (e) {
          console.log("e", e, this);
          if (this.getStatus() === 0) {
            map?.centerAndZoom(e.lnglat, 15);
            // alert("获取定位坐标：" + e.lnglat.lat + "," + e.lnglat.lng);
            const marker = new T.Marker(e.lnglat);
            map?.addOverLay(marker);
          }
          if (this.getStatus() === 1) {
            map?.centerAndZoom(e.lnglat, e.level);
            // alert("获取定位坐标：" + e.lnglat.lat + "," + e.lnglat.lng);
            const marker = new T.Marker(e.lnglat);
            map?.addOverLay(marker);
          }
        };
        lo.getCurrentPosition(fn);
      }

      function localSearchResult(result) {
        //清空地图及搜索列表
        clearAll();
        console.log("result", result);
        console.log({
          getPois: result.getPois(),
          getStatistics: result.getStatistics(),
          getArea: result.getArea(),
          getSuggests: result.getSuggests(),
          getPrompt: result.getPrompt(),
          getLineData: result.getLineData(),
        });
        //添加提示词
        prompt(result);

        //根据返回类型解析搜索结果
        switch (parseInt(result.getResultType())) {
          case 1:
            //解析点数据结果
            pois(result.getPois());
            break;
          case 2:
            //解析推荐城市
            statistics(result.getStatistics());
            break;
          case 3:
            //解析行政区划边界
            area(result.getArea());
            break;
          case 4:
            //解析建议词信息
            suggests(result.getSuggests());
            break;
          case 5:
            //解析公交信息
            lineData(result.getLineData());
            break;
        }
      }

      //解析提示词
      function prompt(obj) {
        const prompts = obj.getPrompt();
        if (prompts) {
          let promptHtml = "";
          for (let i = 0; i < prompts.length; i++) {
            const prompt = prompts[i];
            const promptType = prompt.type;
            const promptAdmins = prompt.admins;
            const meanprompt = prompt.DidYouMean;
            if (promptType === 1) {
              promptHtml += `<p>您是否要在${
                promptAdmins[0].name
              }搜索更多包含<strong>${obj.getKeyword()}</strong>的相关内容？<p>`;
            } else if (promptType === 2) {
              promptHtml += `<p>在<strong>${
                promptAdmins[0].name
              }</strong>没有搜索到与<strong>${obj.getKeyword()}</strong>相关的结果。<p>`;
              if (meanprompt) {
                promptHtml += `<p>您是否要找：<font weight='bold' color='#035fbe'><strong>${meanprompt}</strong></font><p>`;
              }
            } else if (promptType === 3) {
              promptHtml +=
                "<p style='margin-bottom:3px;'>有以下相关结果，您是否要找：</p>";
              for (let i = 0; i < promptAdmins.length; i++) {
                promptHtml += `<p>${promptAdmins[i].name}</p>`;
              }
            }
          }
          console.log("prompts", prompts, promptHtml);

          if (promptHtml !== "") {
            document.getElementById("promptDiv").style.display = "block";
            document.getElementById("promptDiv").innerHTML = promptHtml;
          }
        }
      }

      //解析点数据结果
      function pois(obj) {
        if (obj) {
          //显示搜索列表
          const divMarker = document.createElement("div");
          //坐标数组，设置最佳比例尺时会用到
          const zoomArr = [];
          for (let i = 0; i < obj.length; i++) {
            //名称
            const name = obj[i].name;
            //地址
            const address = obj[i].address;
            //坐标
            const lnglatArr = obj[i].lonlat.split(",");
            const lnglat = new T.LngLat(lnglatArr[0], lnglatArr[1]);

            const winHtml = `名称:${name}<br/>地址:${address}`;

            //创建标注对象
            const marker = new T.Marker(lnglat);
            //地图上添加标注点
            map.addOverLay(marker);
            //注册标注点的点击事件
            const markerInfoWin = new T.InfoWindow(winHtml, {
              autoPan: true,
            });
            marker.addEventListener("click", () => {
              marker.openInfoWindow(markerInfoWin);
            });

            zoomArr.push(lnglat);

            //在页面上显示搜索的列表
            const a = document.createElement("a");
            a.href = "javascript://";
            a.innerHTML = name;
            a.onclick = () => {
              showPosition(marker, winHtml);
            };

            divMarker.appendChild(document.createTextNode(i + 1 + "."));
            divMarker.appendChild(a);
            divMarker.appendChild(document.createElement("br"));
          }
          //显示地图的最佳级别
          map.setViewport(zoomArr);
          console.log("zoomArr", zoomArr);
          //显示搜索结果
          divMarker.appendChild(
            document.createTextNode(
              `共${localsearch.getCountNumber()}条记录，分${localsearch.getCountPage()}页,当前第${localsearch.getPageIndex()}页`
            )
          );
          document.getElementById("searchDiv").appendChild(divMarker);
          document.getElementById("resultDiv").style.display = "block";
        }
      }

      //显示信息
      function showPosition(marker, winHtml) {
        const markerInfoWin = new T.InfoWindow(winHtml, { autoPan: true });
        marker.openInfoWindow(markerInfoWin);
      }

      //解析推荐城市
      const statistics = (obj) => {
        if (obj) {
          const pointsArr = [];
          let priorityCitysHtml = "";
          let allAdminsHtml = "";
          const { priorityCitys, allAdmins } = obj;

          if (priorityCitys) {
            priorityCitysHtml += "在中国以下城市有结果<ul>";
            for (const { name, count } of priorityCitys) {
              priorityCitysHtml += `<li>${name}(${count})</li>`;
            }
            priorityCitysHtml += "</ul>";
          }

          if (allAdmins) {
            allAdminsHtml += "更多城市<ul>";
            for (const { name, count, childAdmins } of allAdmins) {
              allAdminsHtml += `<li>${name}(${count})`;
              if (childAdmins) {
                for (const { name, count } of childAdmins) {
                  allAdminsHtml += `<blockquote>${name}(${count})</blockquote>`;
                }
              }
              allAdminsHtml += "</li>";
            }
            allAdminsHtml += "</ul>";
          }

          const statisticsDiv = document.getElementById("statisticsDiv");
          statisticsDiv.style.display = "block";
          statisticsDiv.innerHTML = priorityCitysHtml + allAdminsHtml;
        }
      };

      //解析行政区划边界
      const area = (obj) => {
        if (obj) {
          const pointsArr = [];
          const { points, lonlat } = obj;

          if (points) {
            for (const { region } of points) {
              const regionLngLats = [];
              const regionArr = region.split(",");
              for (const regionCoords of regionArr) {
                const [lng, lat] = regionCoords.split(" ");
                const lnglat = new T.LngLat(lng, lat);
                regionLngLats.push(lnglat);
                pointsArr.push(lnglat);
              }

              const line = new T.Polyline(regionLngLats, {
                color: "blue",
                weight: 3,
                opacity: 1,
                lineStyle: "dashed",
              });

              map.addOverLay(line);
            }

            map.setViewport(pointsArr);
          }

          if (lonlat) {
            const [lng, lat] = lonlat.split(",");
            map.panTo(new T.LngLat(lng, lat));
          }
        }
      };

      //解析建议词信息
      const suggests = (obj) => {
        if (obj) {
          // 建议词提示，如果搜索类型为公交规划建议词或公交站搜索时，返回结果为公交信息的建议词。
          let suggestsHtml = "建议词提示<ul>";
          for (const { name, address } of obj) {
            suggestsHtml += `<li>${name}&nbsp;&nbsp;<font style='color:#666666'>${address}</font></li>`;
          }
          suggestsHtml += "</ul>";

          const suggestsDiv = document.getElementById("suggestsDiv");
          suggestsDiv.style.display = "block";
          suggestsDiv.innerHTML = suggestsHtml;
        }
      };

      //解析公交信息
      const lineData = (obj) => {
        if (obj) {
          let lineDataHtml = "公交提示<ul>";
          for (const { name, stationNum } of obj) {
            lineDataHtml += `<li>${name}&nbsp;&nbsp;<font style='color:#666666'>共${stationNum}站</font></li>`;
          }
          lineDataHtml += "</ul>";

          const lineDataDiv = document.getElementById("lineDataDiv");
          lineDataDiv.style.display = "block";
          lineDataDiv.innerHTML = lineDataHtml;
        }
      };

      //清空地图及搜索列表
      function clearAll() {
        map.clearOverLays();
        document.getElementById("searchDiv").innerHTML = "";
        document.getElementById("resultDiv").style.display = "none";
        document.getElementById("statisticsDiv").innerHTML = "";
        document.getElementById("statisticsDiv").style.display = "none";
        document.getElementById("promptDiv").innerHTML = "";
        document.getElementById("promptDiv").style.display = "none";
        document.getElementById("suggestsDiv").innerHTML = "";
        document.getElementById("suggestsDiv").style.display = "none";
        document.getElementById("lineDataDiv").innerHTML = "";
        document.getElementById("lineDataDiv").style.display = "none";
      }
    </script>
  </head>
  <body onLoad="onLoad()">
    <div id="mapDiv"></div>
    <div>
      <p>本示例演示如何根据关键字本地搜索。</p>
      <input type="text" id="keyWord" value="天安门" />
      <input
        type="button"
        onClick="localsearch.search(document.getElementById('keyWord').value)"
        value="搜索"
      />
      <br />
      <!-- 提示词面板 -->
      <div id="promptDiv" class="prompt"></div>
      <!-- 统计面板 -->
      <div id="statisticsDiv" class="statistics"></div>
      <!-- 建议词面板 -->
      <div id="suggestsDiv" class="suggests"></div>
      <!-- 公交提示面板 -->
      <div id="lineDataDiv" class="lineData"></div>
      <!-- 搜索结果面板 -->
      <div id="resultDiv" class="result">
        <div id="searchDiv"></div>
        <div id="pageDiv">
          <input
            type="button"
            value="第一页"
            onClick="localsearch.firstPage()"
          />
          <input
            type="button"
            value="上一页"
            onClick="localsearch.previousPage()"
          />
          <input
            type="button"
            value="下一页"
            onClick="localsearch.nextPage()"
          />
          <input
            type="button"
            value="最后一页"
            onClick="localsearch.lastPage()"
          />
          <br />
          转到第<input type="text" value="1" id="pageId" size="3" />页
          <input
            type="button"
            onClick="localsearch.gotoPage(parseInt(document.getElementById('pageId').value));"
            value="转到"
          />
        </div>
      </div>
    </div>
  </body>
</html>
